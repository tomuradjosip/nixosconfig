# Disposable guest smoke stack for CI runner Podman validation.
# Publish on loopback only; no privileged containers; no host socket.
# Named project-local volumes (especially postgres) so `down -v` cleanup is
# assertable — do not rely only on anonymous/container-writable storage.
name: ci-runner-e2e
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ci
      POSTGRES_USER: ci
      POSTGRES_DB: ci
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci -d ci"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  redisdata:
